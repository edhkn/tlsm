<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TLSM Chapter 12: Trauma in Pregnancy - Live Quiz</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background-color: #f2f2f2; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; color: #333; padding: 15px; }

        .screen { display: none; width: 100%; max-width: 850px; text-align: center; }
        .active { display: block; }

        /* Card Container */
        .card { background: white; padding: 35px 25px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.12); }
        .kahoot-theme { background: #46178f; color: white; }

        .logo { font-size: 2.5rem; font-weight: 900; letter-spacing: -1px; margin-bottom: 8px; }
        .subtitle { font-size: 1.15rem; color: #e0d0f5; margin-bottom: 25px; }

        /* Inputs & Buttons */
        .input-group { margin: 15px 0; text-align: left; }
        .input-group label { display: block; font-size: 0.9rem; font-weight: 800; margin-bottom: 5px; color: #ccc; text-transform: uppercase; }
        .text-input { width: 100%; padding: 15px; font-size: 1.2rem; font-weight: 800; border: 2px solid #ccc; border-radius: 8px; outline: none; }
        .text-input:focus { border-color: #00e096; }

        .btn-main { width: 100%; background: #00e096; color: #123826; border: none; padding: 16px; font-size: 1.3rem; font-weight: 900; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 0 #009966; transition: 0.1s; margin-top: 10px; }
        .btn-main:active { transform: translateY(3px); box-shadow: none; }
        .btn-secondary { background: transparent; color: white; border: 2px solid white; padding: 10px 20px; font-weight: 800; border-radius: 8px; cursor: pointer; margin-top: 15px; }

        /* Question & Timer */
        .status-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 12px 20px; background: white; border-radius: 10px; font-size: 1.1rem; font-weight: 800; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.06); }
        .question-card { background: white; position: relative; padding: 45px 25px 25px; border-radius: 12px; min-height: 160px; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(0,0,0,0.08); margin-bottom: 20px; }
        .timer-badge { position: absolute; top: -25px; left: 50%; transform: translateX(-50%); background: #864cbf; color: white; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: 900; border: 4px solid #f2f2f2; }
        #question-text { font-size: 1.3rem; font-weight: 800; line-height: 1.4; }

        /* Answer Grid */
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .option-btn { display: flex; align-items: center; padding: 18px; font-size: 1.05rem; font-weight: 800; color: white; border: none; border-radius: 8px; cursor: pointer; text-align: left; box-shadow: 0 4px 0 rgba(0,0,0,0.2); }
        .option-btn:active { transform: translateY(3px); box-shadow: none; }
        .option-btn .shape { font-size: 1.8rem; margin-right: 14px; flex-shrink: 0; }
        .btn-red { background-color: #e21b3c; }
        .btn-blue { background-color: #1368ce; }
        .btn-yellow { background-color: #d89e00; }
        .btn-green { background-color: #26890c; }
        .disabled { pointer-events: none; opacity: 0.6; }

        /* Feedback Screen */
        .feedback-box { padding: 60px 20px; border-radius: 14px; color: white; }
        .correct { background: #26890c; }
        .incorrect { background: #e21b3c; }
        .points-pill { display: inline-block; background: rgba(0,0,0,0.2); padding: 8px 24px; border-radius: 30px; font-size: 1.8rem; margin-top: 15px; }

        /* Leaderboard & Podium */
        .podium-container { display: flex; justify-content: center; align-items: flex-end; gap: 12px; margin: 30px 0 20px; height: 180px; }
        .podium-step { width: 30%; border-radius: 8px 8px 0 0; display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: 12px; color: white; font-weight: 900; }
        .podium-1 { height: 100%; background: #ffd700; color: #333; }
        .podium-2 { height: 75%; background: #c0c0c0; color: #333; }
        .podium-3 { height: 55%; background: #cd7f32; color: white; }
        .podium-name { font-size: 0.95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 4px; }
        .podium-score { font-size: 0.85rem; }

        .leaderboard-table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.08); margin-top: 15px; }
        .leaderboard-table th { background: #333; color: white; padding: 12px; font-size: 0.9rem; text-align: left; }
        .leaderboard-table td { padding: 10px 12px; border-bottom: 1px solid #eee; text-align: left; font-weight: 700; color: #333; }
        .highlight-row { background: #e8f9f0 !important; font-weight: 900; color: #123826; }

        @media (max-width: 650px) {
            .options-grid { grid-template-columns: 1fr; }
            .logo { font-size: 1.8rem; }
            #question-text { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <!-- SCREEN 1: LOGIN / JOIN -->
    <div id="login-screen" class="screen active">
        <div class="card kahoot-theme">
            <div class="logo">TLSM LIVE QUIZ</div>
            <div class="subtitle">Chapter 12: Trauma in Pregnancy</div>
            <div class="input-group">
                <label>Quiz PIN / ID</label>
                <input type="text" id="quiz-id-input" class="text-input" placeholder="e.g. TLSM2026" maxlength="15">
            </div>
            <div class="input-group">
                <label>Your Nickname</label>
                <input type="text" id="nickname-input" class="text-input" placeholder="Enter your name" maxlength="20">
            </div>
            <button class="btn-main" onclick="joinQuiz()">Enter Game</button>
            <button class="btn-secondary" onclick="viewLiveLeaderboardOnly()">View Live Leaderboard Only</button>
        </div>
    </div>

    <!-- SCREEN 2: GAMEPLAY -->
    <div id="game-screen" class="screen">
        <div class="status-bar">
            <span id="player-tag">Player</span>
            <span id="q-progress">Q: 1/20</span>
            <span id="player-score">Score: 0</span>
        </div>
        <div class="question-card">
            <div class="timer-badge" id="timer">20</div>
            <div id="question-text">Question text</div>
        </div>
        <div class="options-grid" id="options-grid">
            <button class="option-btn btn-red" onclick="submitChoice(1)"><span class="shape">▲</span><span id="opt1"></span></button>
            <button class="option-btn btn-blue" onclick="submitChoice(2)"><span class="shape">◆</span><span id="opt2"></span></button>
            <button class="option-btn btn-yellow" onclick="submitChoice(3)"><span class="shape">●</span><span id="opt3"></span></button>
            <button class="option-btn btn-green" onclick="submitChoice(4)"><span class="shape">■</span><span id="opt4"></span></button>
        </div>
    </div>

    <!-- SCREEN 3: FEEDBACK -->
    <div id="feedback-screen" class="screen">
        <div class="card feedback-box" id="feedback-box">
            <h1 id="feedback-title" style="font-size: 3rem;">Correct!</h1>
            <div class="points-pill" id="feedback-points">+0</div>
        </div>
    </div>

    <!-- SCREEN 4: WINNER LIST / PODIUM -->
    <div id="leaderboard-screen" class="screen">
        <div class="card kahoot-theme">
            <div class="logo">WINNER PODIUM</div>
            <div class="subtitle" id="lb-room-title">Quiz Leaderboard</div>
            
            <div class="podium-container">
                <div class="podium-step podium-2" id="podium-2">
                    <div class="podium-name" id="p2-name">-</div>
                    <div class="podium-score" id="p2-score">0 pts</div>
                    <div>2nd</div>
                </div>
                <div class="podium-step podium-1" id="podium-1">
                    <div class="podium-name" id="p1-name">-</div>
                    <div class="podium-score" id="p1-score">0 pts</div>
                    <div>1st</div>
                </div>
                <div class="podium-step podium-3" id="podium-3">
                    <div class="podium-name" id="p3-name">-</div>
                    <div class="podium-score" id="p3-score">0 pts</div>
                    <div>3rd</div>
                </div>
            </div>

            <table class="leaderboard-table">
                <thead>
                    <tr>
                        <th style="width: 15%;">#</th>
                        <th>Player</th>
                        <th style="width: 25%;">Score</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                    <tr><td colspan="3" style="text-align: center;">Waiting for results...</td></tr>
                </tbody>
            </table>

            <button class="btn-main" onclick="location.reload()" style="margin-top: 25px;">Back to Home</button>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. FIREBASE CONFIGURATION
        // ==========================================
        const firebaseConfig = {
            databaseURL: "https://tlsm-1-default-rtdb.asia-southeast1.firebasedatabase.app/" // e.g. "https://quiz-app-1234-default-rtdb.firebaseio.com"
        };
        
        let db = null;
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
        } catch (e) {
            console.warn("Firebase not configured yet. Set your databaseURL above.");
        }

        // ==========================================
        // 2. 20 MCQs - TLSM CHAPTER 12
        // ==========================================
        const quizData = [
            { q: "Which trimester is the most critical and vulnerable period for fetal development?", options: ["First trimester", "Second trimester", "Third trimester", "Postpartum period"], correct: 1 },
            { q: "What is the primary resuscitation priority in a pregnant trauma patient?", options: ["Resuscitate the fetus first", "Resuscitate the mother", "Perform CTG before ABC assessment", "Perform ultrasound before resuscitation"], correct: 2 },
            { q: "What is the approximate increase in maternal blood volume during pregnancy?", options: ["10%", "20%", "50%", "80%"], correct: 3 },
            { q: "Why is pallor an unreliable indicator of blood loss in pregnancy?", options: ["Haemoglobin always increases", "Conjunctiva and nail beds are normally vasodilated", "Pregnancy prevents blood loss", "Skin colour does not change during shock"], correct: 2 },
            { q: "What is a major consequence of inferior vena cava compression by the gravid uterus?", options: ["Maternal hypotension", "Maternal hypertension", "Increased lung capacity", "Reduced venous stasis"], correct: 1 },
            { q: "By approximately how much does oxygen requirement increase during pregnancy?", options: ["1–5%", "5–10%", "10–20%", "40–50%"], correct: 3 },
            { q: "Which respiratory change commonly occurs during pregnancy?", options: ["Reduced tidal volume", "Reduced basal metabolism", "Physiological hyperventilation", "Increased functional residual capacity"], correct: 3 },
            { q: "Why should a pregnant trauma patient be considered at increased risk of aspiration?", options: ["Gastric emptying is accelerated", "Gastric motility and emptying are slowed", "Gastric acid secretion stops completely", "The gastro-oesophageal junction becomes tighter"], correct: 2 },
            { q: "Which physiological changes increase the risk of venous thromboembolism during pregnancy?", options: ["Reduced coagulation factor production", "Increased fibrinolytic activity", "Procoagulant state and venous stasis", "Reduced blood volume"], correct: 3 },
            { q: "Which placental complication may result from trauma to the uterus?", options: ["Placenta praevia", "Abruptio placentae", "Gestational diabetes", "Hyperemesis gravidarum"], correct: 2 },
            { q: "Trauma to the amniotic cavity may result in which complication?", options: ["Premature rupture of membranes", "Appendicitis", "Renal calculi", "Cholecystitis"], correct: 1 },
            { q: "Which history increases concern for uterine rupture following trauma?", options: ["Previous appendicectomy", "Previous Caesarean section", "Previous ankle fracture", "Previous tonsillectomy"], correct: 2 },
            { q: "Which fetal assessment should be included in the primary survey of a pregnant trauma patient?", options: ["Fetal heart rate assessment", "Fetal weight measurement", "Fetal glucose measurement", "Routine fetal genetic testing"], correct: 1 },
            { q: "Which investigation is described as mandatory in trauma associated with pregnancy in the TLSM chapter?", options: ["MRI of the whole body", "Ultrasound scan", "PET scan", "Abdominal angiography"], correct: 2 },
            { q: "Which presentation is an indication for continuous cardiotocography (CTG) monitoring?", options: ["Isolated mild headache without injury", "Uterine contractions", "Remote history of trauma without current symptoms", "Normal fetal heart rate without other concerns"], correct: 2 },
            { q: "Which laboratory test is specifically highlighted during resuscitation because its level may double in late pregnancy?", options: ["Serum amylase", "Fibrinogen", "Troponin", "Serum calcium"], correct: 2 },
            { q: "Which finding may indicate impending shock despite apparently minor maternal injury?", options: ["Increased urine output", "Fetal tachycardia or bradycardia", "Normal mental status", "Normal maternal oxygen saturation alone"], correct: 2 },
            { q: "Which positioning is recommended to alleviate aortocaval compression when there is no contraindication?", options: ["Right lateral tilt", "Flat supine positioning", "Left lateral tilt", "Prone positioning"], correct: 3 },
            { q: "What treatment is recommended in the TLSM chapter for Rh-negative pregnant trauma patients?", options: ["Routine insulin therapy", "Rh immunoglobulin therapy", "Routine antibiotics for every patient", "No treatment if the injury is minor"], correct: 2 },
            { q: "According to the TLSM chapter, when should resuscitative hysterotomy be considered in a viable pregnancy following maternal cardiac arrest?", options: ["After 15–20 minutes", "Within 4–5 minutes", "After 30 minutes", "Only after spontaneous circulation returns"], correct: 2 }
        ];

        // ==========================================
        // 3. GAME STATE & VARIABLES
        // ==========================================
        let currentQuizId = "";
        let currentUserId = "user_" + Math.random().toString(36).substring(2, 9);
        let currentNickname = "";
        let currentIndex = 0;
        let totalScore = 0;
        let timer = null;
        let timeLeft = 20;

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function joinQuiz() {
            const quizInput = document.getElementById('quiz-id-input').value.trim().toUpperCase();
            const nickInput = document.getElementById('nickname-input').value.trim();

            if (!quizInput || !nickInput) {
                alert("Please enter both a Quiz ID and Nickname!");
                return;
            }

            currentQuizId = quizInput;
            currentNickname = nickInput;
            document.getElementById('player-tag').innerText = currentNickname;

            // Push player entry to Firebase
            if (db) {
                db.ref(`quizzes/${currentQuizId}/players/${currentUserId}`).set({
                    name: currentNickname,
                    score: 0,
                    completed: false,
                    timestamp: Date.now()
                });
            }

            currentIndex = 0;
            totalScore = 0;
            showScreen('game-screen');
            loadQuestion();
        }

        function loadQuestion() {
            const q = quizData[currentIndex];
            document.getElementById('q-progress').innerText = `Q: ${currentIndex + 1}/${quizData.length}`;
            document.getElementById('player-score').innerText = `Score: ${totalScore}`;
            document.getElementById('question-text').innerText = q.q;

            document.getElementById('opt1').innerText = q.options[0];
            document.getElementById('opt2').innerText = q.options[1];
            document.getElementById('opt3').innerText = q.options[2];
            document.getElementById('opt4').innerText = q.options[3];

            document.getElementById('options-grid').classList.remove('disabled');

            timeLeft = 20;
            document.getElementById('timer').innerText = timeLeft;

            clearInterval(timer);
            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    submitChoice(0);
                }
            }, 1000);
        }

        function submitChoice(choiceIndex) {
            clearInterval(timer);
            document.getElementById('options-grid').classList.add('disabled');

            const q = quizData[currentIndex];
            const isCorrect = (choiceIndex === q.correct);
            let gained = 0;

            if (isCorrect) {
                gained = Math.round(500 + (500 * (timeLeft / 20)));
                totalScore += gained;
            }

            // Update real-time score in database
            if (db) {
                db.ref(`quizzes/${currentQuizId}/players/${currentUserId}`).update({
                    score: totalScore
                });
            }

            // Show Feedback
            const fBox = document.getElementById('feedback-box');
            const fTitle = document.getElementById('feedback-title');
            const fPoints = document.getElementById('feedback-points');

            fBox.className = 'card feedback-box ' + (isCorrect ? 'correct' : 'incorrect');
            fTitle.innerText = isCorrect ? "Correct!" : (choiceIndex === 0 ? "Time's Up!" : "Incorrect!");
            fPoints.innerText = isCorrect ? `+${gained}` : "+0";

            showScreen('feedback-screen');

            setTimeout(() => {
                currentIndex++;
                if (currentIndex < quizData.length) {
                    showScreen('game-screen');
                    loadQuestion();
                } else {
                    finishQuiz();
                }
            }, 2000);
        }

        function finishQuiz() {
            if (db) {
                db.ref(`quizzes/${currentQuizId}/players/${currentUserId}`).update({
                    score: totalScore,
                    completed: true
                });
            }
            openLeaderboard();
        }

        function viewLiveLeaderboardOnly() {
            const quizInput = document.getElementById('quiz-id-input').value.trim().toUpperCase();
            if (!quizInput) {
                alert("Please enter a Quiz ID to view its leaderboard!");
                return;
            }
            currentQuizId = quizInput;
            openLeaderboard();
        }

        function openLeaderboard() {
            document.getElementById('lb-room-title').innerText = `Quiz ID: ${currentQuizId}`;
            showScreen('leaderboard-screen');

            if (!db) {
                document.getElementById('leaderboard-body').innerHTML = `
                    <tr><td colspan="3" style="text-align:center;">Firebase databaseURL is not set yet. Running locally. Your score: ${totalScore}</td></tr>`;
                return;
            }

            // Real-time listener for 100+ players
            db.ref(`quizzes/${currentQuizId}/players`).on('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                // Sort players by score descending
                const sortedPlayers = Object.entries(data)
                    .map(([id, p]) => ({ id, ...p }))
                    .sort((a, b) => (b.score || 0) - (a.score || 0));

                renderPodium(sortedPlayers);
            });
        }

        function renderPodium(players) {
            // Podium (Top 3)
            document.getElementById('p1-name').innerText = players[0] ? players[0].name : '-';
            document.getElementById('p1-score').innerText = players[0] ? `${players[0].score} pts` : '0 pts';

            document.getElementById('p2-name').innerText = players[1] ? players[1].name : '-';
            document.getElementById('p2-score').innerText = players[1] ? `${players[1].score} pts` : '0 pts';

            document.getElementById('p3-name').innerText = players[2] ? players[2].name : '-';
            document.getElementById('p3-score').innerText = players[2] ? `${players[2].score} pts` : '0 pts';

            // Full Leaderboard Table (1 to 100+)
            const tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = '';

            players.forEach((p, idx) => {
                const tr = document.createElement('tr');
                if (p.id === currentUserId) tr.classList.add('highlight-row');

                tr.innerHTML = `
                    <td><strong>#${idx + 1}</strong></td>
                    <td>${escapeHtml(p.name)} ${p.id === currentUserId ? '<em>(You)</em>' : ''}</td>
                    <td>${p.score || 0}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, s => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s]));
        }
    </script>
</body>
</html>
